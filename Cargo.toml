[package]
name = "hot-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.42", features = ["derive", "string"] }
colored = "3"
ctrlc = "3.4.7"
glob = "0.3.3"
notify = "8.2.0"
serde = { version = "1.0.219", features = ["derive"] }
snafu = "0.8.6"
tempfile = "3.20.0"
toml = "0.9.5"
tracing = { version = "0.1.41", features = ["release_max_level_off"] }
tracing-subscriber = "0.3.19"
walkdir = "2.5.0"
